name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      SESSION_COOKIE_SECURE: false
      OTP_DEV_LOG_ONLY: true
      ALLOW_PASSWORD_LOGIN: true
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_PRICE_LITE: price_dummy_lite
      STRIPE_PRICE_PRO: price_dummy_pro
      STRIPE_PRICE_PACK_1000: price_dummy_pack_1000
      STRIPE_PRICE_PACK_3000: price_dummy_pack_3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt

      - name: Compile Python files
        run: |
          python -m py_compile app.py auth.py billing.py content.py decorators.py extensions.py history.py models.py services.py static_routes.py tts.py voices.py wsgi.py gunicorn.conf.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Check frontend scripts
        run: |
          node --check static/api.js
          node --check static/synth.js
          node --check static/history.js
          node --check static/player.js
